<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tenant Portal</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f5f6f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .fallback {
      padding: 32px 20px;
      max-width: 440px;
      margin: 0 auto;
      color: #1a2332;
      text-align: center;
    }

    .fallback a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: 8px;
      background: #2b7de9;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <noscript>
    <div class="fallback">
      <h1>Tenant Portal</h1>
      <p>JavaScript is required to open your portal link.</p>
    </div>
  </noscript>
  <script>
    const portalOrigin = 'https://gordos-mac-mini.tailb7a9a2.ts.net'
    const rawPath = window.location.hash.startsWith('#/')
      ? window.location.hash.slice(1)
      : '/'
    const safePath = rawPath.startsWith('/') ? rawPath : '/'
    const target = `${portalOrigin}${safePath}${window.location.search || ''}`

    const frame = document.createElement('iframe')
    frame.title = 'Tenant Portal'
    frame.src = target
    frame.allow = 'camera; microphone; clipboard-write'
    document.body.appendChild(frame)

    const fallback = document.createElement('div')
    fallback.className = 'fallback'
    fallback.innerHTML = `<h1>Tenant Portal</h1><p>If the portal does not load, open it directly.</p><a href="${target}" rel="noopener">Open Portal</a>`
    setTimeout(() => {
      if (!document.body.contains(frame)) document.body.appendChild(fallback)
    }, 3000)
  </script>
</body>
</html>
